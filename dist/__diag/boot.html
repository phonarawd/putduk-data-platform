<!doctype html>
<html lang="ko" data-mode="member">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PUTDUK BOOT DIAG</title>
  <style>body{font-family:monospace;padding:20px;line-height:1.5}#log{white-space:pre-wrap}.ok{color:green}.err{color:red}</style>
</head>
<body>
  <h1>PUTDUK BOOT DIAG</h1>
  <div id="app"></div>
  <pre id="log">START\n</pre>
  <script>
    window.PUTDUK_CONFIG = {
      supabaseUrl: 'https://gaugwamwceqdnqdqrxqg.supabase.co',
      supabasePublishableKey: 'sb_publishable_gQehI4oD_qQm2MEtZ1-OpQ_wLY1SFBb',
      enableWorkApi: true,
      enableFinanceApi: false,
      memberOrigin: 'https://app.hiptk.app',
      opsOrigin: 'https://ops.hiptk.app',
      channelPluginKey: 'a1b92284-6a36-41aa-9f00-4f4b084c4f47'
    };
    const out = document.getElementById('log');
    const log = (msg) => { out.textContent += msg + '\n'; window.__PUTDUK_DIAG_LAST__ = msg; };
    window.addEventListener('error', e => log('WINDOW_ERROR ' + (e.message || e.type)));
    window.addEventListener('unhandledrejection', e => log('REJECTION ' + String(e.reason?.message || e.reason || 'unknown')));
    const scripts = [
      '/assets/origin-split.js?v=diag1',
      '/assets/vendor/supabase.min.js?v=diag1',
      '/assets/ui-icons.js?v=diag1',
      '/assets/motion-runtime.js?v=diag1',
      '/assets/overlay-surface.js?v=diag1',
      '/assets/channel-talk.js?v=20260920-ch2',
      '/assets/app.js?v=20260920-recovery1',
      '/assets/phase4-finance-wiring.js?v=diag1',
      '/assets/brand-runtime.js?v=diag1',
      '/assets/uiux-final-2026.js?v=diag1',
      '/assets/uiux-premium-2026.js?v=diag1',
      '/assets/uiux-growth-2026.js?v=diag1',
      '/assets/uiux-auth-2026.js?v=diag1',
      '/assets/uiux-legal-2026.js?v=diag1',
      '/assets/uiux-compliance-2026.js?v=diag1'
    ];
    function load(src) {
      return new Promise((resolve) => {
        log('BEFORE ' + src);
        const s = document.createElement('script');
        s.src = src;
        s.async = false;
        let done = false;
        const finish = (label) => { if (done) return; done = true; log(label + ' ' + src); resolve(); };
        s.onload = () => finish('AFTER');
        s.onerror = () => finish('LOAD_ERROR');
        document.body.appendChild(s);
        setTimeout(() => finish('TIMEOUT'), 8000);
      });
    }
    (async () => {
      for (const src of scripts) {
        await load(src);
        await new Promise(r => setTimeout(r, 100));
      }
      log('DIAG_COMPLETE');
    })();
  </script>
</body>
</html>
