name: 퍼뜩 품질 확인

# PR과 main에서 자동으로 로컬 표준 품질검증을 돌린다.
# 배포 전 차단은 GitHub required check + 이 workflow가 함께 담당한다.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 정적 파일·테스트·보안 확인
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 로컬 표준 품질검증과 동일한 검사
        run: pnpm quality:local
