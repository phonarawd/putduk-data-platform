name: 퍼뜩 품질 확인

# GitHub Actions 유료 한도에 의존하지 않습니다.
# 기본 검증은 로컬에서 `pnpm quality:local`로 실행합니다.
# 이 workflow는 향후 Actions를 다시 사용할 수 있을 때 수동 실행용으로만 남깁니다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 정적 파일·테스트·보안 확인
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 로컬 표준 품질검증과 동일한 검사
        run: pnpm quality:local
