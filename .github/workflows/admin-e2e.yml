name: 퍼뜩 Production Admin E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-e2e:
    name: Production Admin authenticated E2E
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://ops.hiptk.app
      PUTDUK_ADMIN_EMAIL: ${{ secrets.PUTDUK_ADMIN_EMAIL }}
      PUTDUK_ADMIN_PASSWORD: ${{ secrets.PUTDUK_ADMIN_PASSWORD }}
      PUTDUK_TRIAL_EMAIL: ${{ secrets.PUTDUK_TRIAL_EMAIL }}
      PUTDUK_TRIAL_PASSWORD: ${{ secrets.PUTDUK_TRIAL_PASSWORD }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: Admin 인증 비밀 확인
        run: test -n "$PUTDUK_ADMIN_EMAIL" && test -n "$PUTDUK_ADMIN_PASSWORD"

      - name: Playwright Chromium 준비
        run: pnpm exec playwright install --with-deps chromium
      - name: Production Admin authenticated E2E
        run: pnpm exec playwright test --config=playwright.admin.config.ts