name: 퍼뜩 품질 확인

# GitHub Actions runner/결제 한도에 품질 기준을 의존하지 않는다.
# 기본 검증은 로컬에서 `pnpm quality:local`로 실행한다.
# 이 workflow는 Actions 실행 가능 여부를 확인하거나 필요할 때 수동 검증하는 용도로만 유지한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 정적 파일·테스트·보안 확인
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 로컬 표준 품질검증과 동일한 검사
        run: pnpm quality:local
