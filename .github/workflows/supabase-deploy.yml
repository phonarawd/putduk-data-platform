name: Supabase 운영 배포

# GitHub Actions는 운영 필수 배포 경로가 아니라 수동 보조 경로로만 유지한다.
# 기본 운영 반영은 작업 branch 검증 → Supabase MCP/CLI 적용 → integrity/security 확인 → main 기록 순서다.
# 프로젝트 ref가 다르면 preflight에서 즉시 중단한다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: putduk-supabase-production
  cancel-in-progress: false

env:
  PUTDUK_EXPECTED_PROJECT_REF: gaugwamwceqdnqdqrxqg
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  PUTDUK_PAYOUT_SECRET: ${{ secrets.PUTDUK_PAYOUT_SECRET }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    name: 마이그레이션·Edge Function 운영 배포
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Secret·운영 프로젝트 사전 검사
        run: bash tooling/supabase/preflight-secrets.sh

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Supabase CLI 준비
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Edge import graph 검사
        run: node tooling/supabase/verify-functions-graph.mjs

      - name: 프로젝트 연결
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migration drift 사전 검사
        run: node tooling/supabase/verify-migrations.mjs

      - name: 데이터베이스 마이그레이션
        run: supabase db push --linked --yes

      - name: Migration 적용 검증
        run: node tooling/supabase/verify-migrations.mjs

      - name: 지급정보 Secret 동기화
        run: |
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          umask 077
          printf 'PUTDUK_PAYOUT_SECRET=%s\n' "$PUTDUK_PAYOUT_SECRET" > "$TMPDIR/payout.env"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$TMPDIR/payout.env"

      - name: Web Push Secret 동기화
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUTDUK_PUSH_DISPATCH_SECRET: ${{ secrets.PUTDUK_PUSH_DISPATCH_SECRET }}
        run: |
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          umask 077
          printf 'VAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=%s\nPUTDUK_PUSH_DISPATCH_SECRET=%s\n' \
            "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "${VAPID_SUBJECT:-mailto:putduk.operator@gmail.com}" "$PUTDUK_PUSH_DISPATCH_SECRET" \
            > "$TMPDIR/push.env"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$TMPDIR/push.env"
          node tooling/supabase/sync-push-dispatch-config.mjs

      - name: Edge Function 배포
        run: |
          supabase functions deploy admin-control --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy admin-phase5 --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy admin-master --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy member-finance --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy member-push --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy push-dispatch --project-ref "$SUPABASE_PROJECT_REF"

      - name: Edge 인증 스모크
        env:
          SUPABASE_URL: https://${{ env.PUTDUK_EXPECTED_PROJECT_REF }}.supabase.co
        run: node tooling/supabase/verify-edge.mjs

      - name: DB 무결성 검사
        run: node tooling/supabase/verify-integrity.mjs

      - name: Security Advisor 검사
        run: node tooling/supabase/verify-security.mjs
