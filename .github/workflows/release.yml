name: 퍼뜩 릴리스 확인

# Cloudflare 운영 배포는 Pages Git Integration이 main push를 직접 감지합니다.
# 이 workflow는 향후 billing/spending limit 해소 시 수동 검증용으로만 사용합니다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: 수동 릴리스 검증
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 릴리스 검증
        run: pnpm release:deploy

      - name: 릴리스 초안
        run: pnpm release:notes

      - name: 안내
        run: echo "Cloudflare production은 GitHub main push를 Pages Git Integration이 직접 배포합니다."
