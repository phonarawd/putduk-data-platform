name: 퍼뜩 품질 확인

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: putduk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 정적 파일·워크스페이스 확인
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 출시 파일 확인
        run: pnpm verify
