name: 퍼뜩 품질 확인

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: putduk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 정적 파일·테스트·보안 확인
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 출시 파일 확인
        run: pnpm verify

      - name: 문법 확인
        run: pnpm typecheck

      - name: 단위 테스트
        run: pnpm test

      - name: 정적 E2E
        run: pnpm test:e2e

      - name: 접근성 정적 검사
        run: pnpm test:a11y

      - name: 보안 검사
        run: pnpm security:scan

      - name: 성능 설정 검사
        run: pnpm test:performance

      - name: 로컬 헬스체크
        run: pnpm healthcheck
