name: legal-version-one-shot

on:
  push:
    branches:
      - feat/uiux-final-2026

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/uiux-final-2026

      - name: Patch exactly two legal evidence literals
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'dist/assets/app.js';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            ["terms_version: '2026-09-16'", "terms_version: '2026-09-19'"],
            ["privacy_version: '2026-09-16'", "privacy_version: '2026-09-19'"]
          ];
          for (const [from, to] of replacements) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected one occurrence of ${from}, found ${count}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source);
          NODE

          node --check dist/assets/app.js
          node --test tests/unit/uiux-auth-2026.test.mjs

          stats="$(git diff --numstat -- dist/assets/app.js)"
          expected=$'2\t2\tdist/assets/app.js'
          test "$stats" = "$expected"

          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check

          git config user.name "phonarawd"
          git config user.email "4tencpkr@gmail.com"
          git add dist/assets/app.js .github/workflows/ci.yml
          git commit -m "fix: align signup legal evidence version"
          git push origin HEAD:feat/uiux-final-2026
