name: Supabase 롤백

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: 되돌릴 커밋 SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: putduk-supabase-production
  cancel-in-progress: false

jobs:
  rollback:
    name: 지정 커밋 Edge Function 재배포
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      PUTDUK_PAYOUT_SECRET: ${{ secrets.PUTDUK_PAYOUT_SECRET }}
    steps:
      - name: Secret 사전 검사
        run: |
          set -eu
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then echo "::error::SUPABASE_PROJECT_REF is missing"; exit 1; fi
          if [ -z "${PUTDUK_PAYOUT_SECRET:-}" ]; then echo "::error::PUTDUK_PAYOUT_SECRET is missing"; exit 1; fi

      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}

      - name: Supabase CLI 준비
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Edge Function 재배포
        run: |
          supabase functions deploy admin-control --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy member-finance --project-ref "$SUPABASE_PROJECT_REF"

      - name: 안내
        run: echo "데이터베이스 롤백은 역방향 마이그레이션을 별도 적용해야 합니다."
