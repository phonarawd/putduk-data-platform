name: Supabase 롤백

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: 되돌릴 커밋 SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: putduk-supabase-production
  cancel-in-progress: false

jobs:
  rollback:
    name: 지정 커밋 Edge Function 재배포
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}

      - name: Supabase CLI 준비
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Edge Function 재배포
        run: |
          supabase functions deploy admin-control --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy member-finance --project-ref "$SUPABASE_PROJECT_REF"

      - name: 안내
        run: echo "데이터베이스 롤백은 자동 수행하지 않습니다. DB는 forward-fix migration을 별도로 적용합니다."
